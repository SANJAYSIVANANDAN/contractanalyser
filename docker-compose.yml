services:
  postgres:
    image: pgvector/pgvector:pg16        # Postgres 16 with the pgvector extension preinstalled
    env_file: .env
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data  # persistent DB volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One image (built from the single Dockerfile), three different `command:`s below.
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports: ["8001:8000"]
    volumes:
      - .:/app                            # live code reload during development
      - uploads:/app/uploads              # shared with the worker
      - model_cache:/root/.cache          # reranker/Docling model downloads once
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    volumes:
      - .:/app
      - uploads:/app/uploads              # SAME volume as the api
      - model_cache:/root/.cache          # Docling/HuggingFace models download ONCE, then persist
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      API_URL: http://api:8000            # container-to-container address
    ports: ["8502:8501"]
    depends_on:
      - api

volumes:
  model_cache:
  pgdata:
  uploads:
